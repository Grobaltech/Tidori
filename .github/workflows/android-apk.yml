name: Build Tidori Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Prepare Android project
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Add the GOOGLE_SERVICES_JSON repository secret from your Firebase Android app (com.grobaltech.tidori)."
            exit 1
          fi
          npx cap add android
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          npx cap sync android
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android/build.gradle')
          text = root.read_text()
          if 'com.google.gms:google-services' not in text:
              text = text.replace('dependencies {', 'dependencies {' + chr(10) + "        classpath 'com.google.gms:google-services:4.4.2'", 1)
              root.write_text(text)
          app = Path('android/app/build.gradle')
          text = app.read_text()
          if 'com.google.gms.google-services' not in text:
              app.write_text(text + chr(10) + "apply plugin: 'com.google.gms.google-services'" + chr(10))
          config = Path('android/app/google-services.json').read_text()
          if 'com.grobaltech.tidori' not in config:
              raise SystemExit('google-services.json must contain package_name com.grobaltech.tidori')
          PY
      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Tidori-Ministries-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
