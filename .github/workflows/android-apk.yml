name: Build Tidori Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.ts'
      - 'firebase/google-services.json'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Build website assets
        run: npm run build
      - name: Install TypeScript for Capacitor config
        run: npm install --no-save typescript
      - name: Prepare Android project
        run: |
          npx cap add android
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json
          npx cap sync android
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android/build.gradle')
          text = root.read_text()
          if 'com.google.gms:google-services' not in text:
              text = text.replace('dependencies {', 'dependencies {' + chr(10) + "        classpath 'com.google.gms:google-services:4.4.2'", 1)
              root.write_text(text)
          app = Path('android/app/build.gradle')
          text = app.read_text()
          if 'com.google.gms.google-services' not in text:
              app.write_text(text + chr(10) + "apply plugin: 'com.google.gms.google-services'" + chr(10))
          config = Path('android/app/google-services.json').read_text()
          if 'com.grobaltech.tidori' not in config:
              raise SystemExit('google-services.json must contain package_name com.grobaltech.tidori')
          PY
      - name: Apply Tidori logo as Android app icon
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          curl --fail --silent --show-error 'https://tidori-ministries.grobaltechtechnologies.workers.dev/img/grok_1793864104245.jpg' -o /tmp/tidori-logo.jpg
          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          src = Image.open('/tmp/tidori-logo.jpg').convert('RGB')
          sizes = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for density, size in sizes.items():
              canvas = Image.new('RGB',(size,size),'white')
              logo = ImageOps.contain(src,(int(size*.82),int(size*.82)))
              canvas.paste(logo,((size-logo.width)//2,(size-logo.height)//2))
              folder = Path(f'android/app/src/main/res/mipmap-{density}')
              folder.mkdir(parents=True,exist_ok=True)
              canvas.save(folder/'ic_launcher.png', optimize=True)
              canvas.save(folder/'ic_launcher_round.png', optimize=True)
          print('Tidori logo installed as launcher and round icons.')
          PY
      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Tidori-Ministries-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
