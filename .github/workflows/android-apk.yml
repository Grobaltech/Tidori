name: Build Tidori Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'capacitor.config.json'
      - 'firebase/google-services.json'
      - 'native/android/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Tidori
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build website assets
        run: npm run build

      - name: Generate a clean Capacitor Android project
        run: |
          # The repository stores a manifest template, not a complete Android
          # Studio project. Regenerate the native scaffold on every build.
          rm -rf android
          npx cap add android
          cp native/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp firebase/google-services.json android/app/google-services.json
          npx cap sync android

      - name: Configure Firebase messaging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android/build.gradle')
          text = root.read_text()
          if 'com.google.gms:google-services' not in text:
              if 'dependencies {' not in text:
                  raise SystemExit('Could not locate Android root Gradle dependencies block.')
              text = text.replace(
                  'dependencies {',
                  'dependencies {\n        classpath \'com.google.gms:google-services:4.4.2\'',
                  1
              )
              root.write_text(text)

          app = Path('android/app/build.gradle')
          text = app.read_text()
          if 'com.google.gms.google-services' not in text:
              app.write_text(text.rstrip() + '\n\napply plugin: \'com.google.gms.google-services\'\n')

          import json
          config = json.loads(Path('android/app/google-services.json').read_text())
          packages = [
              client.get('client_info', {}).get('android_client_info', {}).get('package_name')
              for client in config.get('client', [])
          ]
          if 'com.grobaltech.tidori' not in packages:
              raise SystemExit('Firebase google-services.json must include com.grobaltech.tidori.')
          PY

      - name: Apply the exact Tidori website logo as the Android launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          python3 - <<'PY'
          import base64
          import re
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageOps

          # The site's favicon contains the actual Tidori logo image.
          # Extract it instead of using a random page image from public/img.
          favicon = Path('public/favicon.svg').read_text()
          match = re.search(r'href="data:image/[^;]+;base64,([^"]+)"', favicon)
          if not match:
              raise SystemExit('Could not extract the embedded Tidori logo from public/favicon.svg')

          source = Image.open(BytesIO(base64.b64decode(match.group(1)))).convert('RGBA')
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}

          for density, size in sizes.items():
              # Adaptive icon foreground: transparent padding keeps the logo
              # inside Android's circular/squircle launcher mask.
              foreground = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              logo = ImageOps.contain(source, (int(size * .76), int(size * .76)))
              foreground.alpha_composite(logo, ((size - logo.width) // 2, (size - logo.height) // 2))

              # Legacy launcher icon: same logo on a clean white background.
              legacy = Image.new('RGBA', (size, size), (255, 255, 255, 255))
              legacy.alpha_composite(logo, ((size - logo.width) // 2, (size - logo.height) // 2))

              folder = Path(f'android/app/src/main/res/mipmap-{density}')
              folder.mkdir(parents=True, exist_ok=True)
              foreground.save(folder / 'ic_launcher_foreground.png', optimize=True)
              legacy.save(folder / 'ic_launcher.png', optimize=True)
              legacy.save(folder / 'ic_launcher_round.png', optimize=True)

          print('Applied the embedded Tidori favicon logo to all Android launcher icon densities.')
          PY

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish APK as a downloadable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          TAG="tidori-android-${{ github.run_number }}"
          gh release create "$TAG" "$APK#Tidori-Ministries.apk" \
            --title "Tidori Ministries Android APK - Build ${{ github.run_number }}" \
            --notes "Automated Android test build from commit ${{ github.sha }}. Install on an Android device to test camera and microphone permissions for Tidori video calling."

      - name: Keep APK in workflow artifacts too
        uses: actions/upload-artifact@v4
        with:
          name: Tidori-Ministries-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
