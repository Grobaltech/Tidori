name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Dependency caching is disabled until package-lock.json is committed.
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run
